<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Governed analytics data product reference implementation</title>
  <desc id="desc">A flow from source contracts through tested transformations and reusable data products to governed business decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06192b"/>
      <stop offset="1" stop-color="#0b4160"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00101f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="170" fill="#15b7c9" opacity="0.08"/>
  <circle cx="110" cy="590" r="230" fill="#2a78b8" opacity="0.10"/>
  <text x="72" y="88" fill="#f5fbff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">From fragmented sources to governed decisions</text>
  <text x="72" y="130" fill="#b8d7e5" font-family="Segoe UI, Arial, sans-serif" font-size="22">Working reference implementation · inspectable contracts · tested transformations · owned metrics</text>
  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="70" y="205" width="225" height="190" rx="18" fill="#ffffff"/>
    <rect x="332" y="205" width="225" height="190" rx="18" fill="#ffffff"/>
    <rect x="594" y="205" width="225" height="190" rx="18" fill="#ffffff"/>
    <rect x="856" y="205" width="274" height="190" rx="18" fill="#ffffff"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="96" y="250" fill="#13879a" font-size="16" font-weight="700">01 · GOVERN INPUTS</text>
    <text x="96" y="292" fill="#102a3a" font-size="26" font-weight="700">Source contracts</text>
    <text x="96" y="326" fill="#526975" font-size="17">Grain · keys · freshness</text>
    <text x="96" y="354" fill="#526975" font-size="17">sensitivity · ownership</text>
    <text x="358" y="250" fill="#13879a" font-size="16" font-weight="700">02 · RECONCILE</text>
    <text x="358" y="292" fill="#102a3a" font-size="26" font-weight="700">Tested models</text>
    <text x="358" y="326" fill="#526975" font-size="17">Staging · identities</text>
    <text x="358" y="354" fill="#526975" font-size="17">facts · dimensions</text>
    <text x="620" y="250" fill="#13879a" font-size="16" font-weight="700">03 · SERVE</text>
    <text x="620" y="292" fill="#102a3a" font-size="26" font-weight="700">Priority marts</text>
    <text x="620" y="326" fill="#526975" font-size="17">Customer · campaign</text>
    <text x="620" y="354" fill="#526975" font-size="17">experiment · ML features</text>
    <text x="882" y="250" fill="#13879a" font-size="16" font-weight="700">04 · DECIDE</text>
    <text x="882" y="292" fill="#102a3a" font-size="26" font-weight="700">Trusted consumption</text>
    <text x="882" y="326" fill="#526975" font-size="17">Governed metrics · lineage</text>
    <text x="882" y="354" fill="#526975" font-size="17">quality · operating controls</text>
  </g>
  <g stroke="#48c3d4" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M295 300 H322"/>
    <path d="M557 300 H584"/>
    <path d="M819 300 H846"/>
  </g>
  <g fill="#48c3d4">
    <path d="M322 300 l-12 -8 v16 z"/>
    <path d="M584 300 l-12 -8 v16 z"/>
    <path d="M846 300 l-12 -8 v16 z"/>
  </g>
  <rect x="70" y="444" width="1060" height="126" rx="18" fill="#062239" stroke="#2f879f" stroke-width="2"/>
  <text x="98" y="480" fill="#6bd6df" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">BUYER RECEIVES</text>
  <text x="98" y="516" fill="#f5fbff" font-family="Segoe UI, Arial, sans-serif" font-size="20">Source contracts · tested data model · priority mart · metric catalog · lineage</text>
  <text x="98" y="548" fill="#f5fbff" font-family="Segoe UI, Arial, sans-serif" font-size="20">Quality controls · operating runbook · executive recommendation</text>
  <text x="70" y="606" fill="#9fc5d5" font-family="Segoe UI, Arial, sans-serif" font-size="16">Synthetic reference implementation. Production scope and acceptance thresholds are agreed after source and decision review.</text>
