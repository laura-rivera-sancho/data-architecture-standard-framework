[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "data-architecture-standard-framework"
version = "0.1.0"
description = "Governed source contracts, dimensional models, data marts, and semantic definitions."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["duckdb==1.5.5", "PyYAML==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["data_architecture"]

[tool.coverage.report]
show_missing = true
fail_under = 85
