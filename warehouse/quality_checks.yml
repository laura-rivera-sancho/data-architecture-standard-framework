checks:
  - name: customer_business_version_grain
    description: Customer business key and effective timestamp identify one dimension row.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT customer_id, valid_from
          FROM warehouse.dim_customer
          GROUP BY customer_id, valid_from
          HAVING COUNT(*) > 1
      )
  - name: one_current_customer_version
    description: Every non-unknown customer has exactly one current dimension row.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT customer_id
          FROM warehouse.dim_customer
          WHERE customer_key <> 0
          GROUP BY customer_id
          HAVING SUM(CAST(is_current AS INTEGER)) <> 1
      )
  - name: order_fact_grain
    description: Order fact contains at most one row per operational order.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT order_id
          FROM warehouse.fact_orders
          GROUP BY order_id
          HAVING COUNT(*) > 1
      )
  - name: order_item_fact_grain
    description: Order item fact contains at most one row per order and line number.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT order_id, line_number
          FROM warehouse.fact_order_items
          GROUP BY order_id, line_number
          HAVING COUNT(*) > 1
      )
  - name: order_customer_relationship
    description: Every order fact resolves to a customer dimension member.
    expected_value: 0
    sql: |
      SELECT COUNT(*)
      FROM warehouse.fact_orders AS facts
      LEFT JOIN warehouse.dim_customer AS dimensions USING (customer_key)
      WHERE dimensions.customer_key IS NULL
  - name: order_date_relationship
    description: Every order fact resolves to a calendar dimension member.
    expected_value: 0
    sql: |
      SELECT COUNT(*)
      FROM warehouse.fact_orders AS facts
      LEFT JOIN warehouse.dim_date AS dimensions ON facts.order_date_key = dimensions.date_key
      WHERE dimensions.date_key IS NULL
  - name: order_item_product_relationship
    description: Every order item resolves to a product dimension member.
    expected_value: 0
    sql: |
      SELECT COUNT(*)
      FROM warehouse.fact_order_items AS facts
      LEFT JOIN warehouse.dim_product AS dimensions USING (product_key)
      WHERE dimensions.product_key IS NULL
  - name: touchpoint_dimension_relationships
    description: Every campaign touchpoint resolves to customer, campaign, channel, and date dimensions.
    expected_value: 0
    sql: |
      SELECT COUNT(*)
      FROM warehouse.fact_campaign_touchpoints AS facts
      LEFT JOIN warehouse.dim_customer AS customers USING (customer_key)
      LEFT JOIN warehouse.dim_campaign AS campaigns USING (campaign_key)
      LEFT JOIN warehouse.dim_channel AS channels USING (channel_key)
      LEFT JOIN warehouse.dim_date AS dates ON facts.touchpoint_date_key = dates.date_key
      WHERE customers.customer_key IS NULL
         OR campaigns.campaign_key IS NULL
         OR channels.channel_key IS NULL
         OR dates.date_key IS NULL
  - name: order_header_line_reconciliation
    description: Summed line gross equals the order-header gross amount.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT orders.order_id
          FROM warehouse.fact_orders AS orders
          JOIN warehouse.fact_order_items AS items USING (order_key)
          GROUP BY orders.order_id, orders.gross_amount
          HAVING ABS(orders.gross_amount - SUM(items.line_gross_amount)) > 0.01
      )
  - name: recognized_revenue_rule
    description: Cancelled and refunded orders have zero recognized revenue.
    expected_value: 0
    sql: |
      SELECT COUNT(*)
      FROM warehouse.fact_orders
      WHERE order_status IN ('cancelled', 'refunded')
        AND recognized_revenue <> 0
  - name: positive_item_quantity
    description: Every order item records a positive quantity.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM warehouse.fact_order_items WHERE quantity <= 0
  - name: fact_source_row_count_reconciliation
    description: Every contracted source row is represented in its corresponding fact table.
    expected_value: 0
    sql: |
      SELECT
          ABS((SELECT COUNT(*) FROM staging.orders)
              - (SELECT COUNT(*) FROM warehouse.fact_orders))
        + ABS((SELECT COUNT(*) FROM staging.order_items)
              - (SELECT COUNT(*) FROM warehouse.fact_order_items))
        + ABS((SELECT COUNT(*) FROM staging.campaign_touchpoints)
              - (SELECT COUNT(*) FROM warehouse.fact_campaign_touchpoints))
        + ABS((SELECT COUNT(*) FROM staging.experiment_exposures)
              - (SELECT COUNT(*) FROM warehouse.fact_experiment_exposures))
        + ABS((SELECT COUNT(*) FROM staging.customer_events)
              - (SELECT COUNT(*) FROM warehouse.fact_customer_events))
  - name: customer_360_grain
    description: Customer 360 contains at most one row per current customer.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT customer_key
          FROM marts.customer_360
          GROUP BY customer_key
          HAVING COUNT(*) > 1
      )
  - name: customer_360_coverage
    description: Customer 360 covers every non-unknown current customer.
    expected_value: 0
    sql: |
      SELECT ABS(
          (SELECT COUNT(*) FROM marts.customer_360)
          - (SELECT COUNT(*) FROM warehouse.dim_customer WHERE customer_key <> 0 AND is_current)
      )
  - name: rfm_grain_and_score_bounds
    description: RFM has one row per purchasing customer and scores remain between one and five.
    expected_value: 0
    sql: |
      SELECT
          (SELECT COUNT(*) FROM (
              SELECT customer_key
              FROM marts.rfm_segments
              GROUP BY customer_key
              HAVING COUNT(*) > 1
          ))
        + (SELECT COUNT(*)
           FROM marts.rfm_segments
           WHERE recency_score NOT BETWEEN 1 AND 5
              OR frequency_score NOT BETWEEN 1 AND 5
              OR monetary_score NOT BETWEEN 1 AND 5)
  - name: campaign_performance_grain
    description: Campaign performance contains one row per campaign and channel.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT campaign_key, channel_key
          FROM marts.campaign_performance
          GROUP BY campaign_key, channel_key
          HAVING COUNT(*) > 1
      )
  - name: campaign_performance_reconciliation
    description: Campaign mart counts and cost reconcile to the touchpoint fact.
    expected_value: 0
    sql: |
      SELECT
          ABS((SELECT SUM(touchpoint_count) FROM marts.campaign_performance)
              - (SELECT COUNT(*) FROM warehouse.fact_campaign_touchpoints))
        + ABS((SELECT SUM(delivered_count) FROM marts.campaign_performance)
              - (SELECT SUM(delivered_count) FROM warehouse.fact_campaign_touchpoints))
        + ABS((SELECT SUM(opened_count) FROM marts.campaign_performance)
              - (SELECT SUM(opened_count) FROM warehouse.fact_campaign_touchpoints))
        + ABS((SELECT SUM(clicked_count) FROM marts.campaign_performance)
              - (SELECT SUM(clicked_count) FROM warehouse.fact_campaign_touchpoints))
        + ABS((SELECT SUM(converted_count) FROM marts.campaign_performance)
              - (SELECT SUM(converted_count) FROM warehouse.fact_campaign_touchpoints))
        + ABS((SELECT SUM(attributed_cost) FROM marts.campaign_performance)
              - (SELECT SUM(attributed_cost) FROM warehouse.fact_campaign_touchpoints))
  - name: experiment_results_grain
    description: Experiment results contain one row per experiment and assigned variant.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT experiment_id, variant
          FROM marts.experiment_results
          GROUP BY experiment_id, variant
          HAVING COUNT(*) > 1
      )
  - name: experiment_assignment_reconciliation
    description: Experiment mart assignments reconcile to exposure facts.
    expected_value: 0
    sql: |
      SELECT ABS(
          (SELECT SUM(assignments) FROM marts.experiment_results)
          - (SELECT COUNT(*) FROM warehouse.fact_experiment_exposures)
      )
  - name: ml_feature_grain
    description: The feature mart contains one row per customer and as-of date.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT customer_key, as_of_date
          FROM marts.ml_features
          GROUP BY customer_key, as_of_date
          HAVING COUNT(*) > 1
      )
  - name: executive_growth_grain
    description: Executive growth contains one row per calendar month.
    expected_value: 0
    sql: |
      SELECT COUNT(*) FROM (
          SELECT month_start
          FROM marts.executive_growth
          GROUP BY month_start
          HAVING COUNT(*) > 1
      )
  - name: executive_revenue_reconciliation
    description: Executive monthly revenue reconciles to recognized order revenue.
    expected_value: 0
    sql: |
      SELECT ABS(
          (SELECT SUM(recognized_revenue) FROM marts.executive_growth)
          - (SELECT SUM(recognized_revenue) FROM warehouse.fact_orders)
      )
